name: Development verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_DATABASE: dermamatrix_ci_synthetic
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: dermamatrix-ai
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: synthetic-ci-only
      MYSQL_DATABASE: dermamatrix_ci_synthetic
      DERMAMATRIX_ENV: test
      DERMAMATRIX_INITIALISE_SCHEMA: 'false'
      DERMAMATRIX_CONSUMER_ENABLED: 'false'
      FLASK_SECRET_KEY: synthetic-ci-secret-never-for-real-use-20261027
      DERMAMATRIX_START_MYSQL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: dermamatrix-ai/backend/requirements-local.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned development dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0 torchvision==0.29.0
          python -m pip install -r backend/requirements-local.lock
          python -m pip check
      - name: Explicit migrations and regression tests
        run: |
          PYTHONPATH=backend python backend/scripts/migrate_database.py --apply
          DERMAMATRIX_RUN_MYSQL_INTEGRATION_TESTS=1 PYTHONPATH=backend:backend/tests python -m unittest discover -s backend/tests -v
          node --test frontend/tests/*.test.cjs
          node --check frontend/app.js
          node --check frontend/consumer.js
          node --check frontend/engagement.js
          git diff --check
      - name: Dependency and tracked-secret checks
        run: |
          python backend/scripts/check_tracked_secrets.py
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --disable-pip --no-deps -r backend/requirements-local.lock
      - name: Browser smoke against isolated local stack
        env:
          DERMAMATRIX_CONSUMER_ENABLED: 'true'
          DERMAMATRIX_MAIL_TRANSPORT: disabled
        run: |
          npm install --global @playwright/cli@0.1.22
          python -m gunicorn --chdir backend --bind 127.0.0.1:8001 --workers 1 app:app > /tmp/dermamatrix-ci.log 2>&1 &
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8001/api/readiness && break; sleep 1; done
          playwright-cli -s=ci open http://127.0.0.1:8001 --browser=chrome
          playwright-cli -s=ci run-code --filename=frontend/tests/browser-smoke.js
          playwright-cli -s=ci close
